{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="stack" style="--stack-gap: 10px; margin-bottom: 24px;">
      {% for category, message in messages %}
        <p class="alert alert--{{ category }}">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

name: CI

on:
  push:
    branches: [main, master, phase3]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q

  smoke:
    name: Build the database and serve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The database is no longer committed, so "does a fresh checkout actually
      # run" is a question only this job answers.
      - name: A fresh checkout builds its own database and serves
        run: |
          test ! -f data/Music_Mania.db || (echo "data/Music_Mania.db is committed again"; exit 1)
          flask --app run init-db
          flask --app run run --host 127.0.0.1 --port 5000 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/login; then
              curl -fsS -o /dev/null http://127.0.0.1:5000/about
              echo "served login and about"
              exit 0
            fi
            sleep 1
          done
          echo "app did not come up within 30s"
          exit 1

  secrets:
    name: No database or credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # This repository shipped a SQLite file containing real accounts, and a
      # test that logged in with a real person's password in plaintext. Neither
      # is coming back by accident.
      - name: No SQLite file is tracked
        run: |
          if git ls-files | grep -E '\.(db|sqlite|sqlite3)$'; then
            echo "a database file is tracked; the app builds one with 'flask --app run init-db'"
            exit 1
          fi
          echo "no tracked database"

      # Signup tests legitimately invent a password, and the injection tests pass
      # junk. What must never reappear is the credential that was published.
      - name: The leaked account password is gone from the tree
        run: |
          if git grep -qi "delhiking" -- . ; then
            echo "the published password is back in the tree"
            exit 1
          fi
          echo "leaked credential absent"

      - name: Authenticated fixtures use the demo seed
        run: |
          if grep -rn "auth_client" tests/conftest.py | grep -q "DEMO_PASSWORD"; then
            echo "auth fixture uses the demo account"
          else
            grep -n "DEMO_PASSWORD" tests/conftest.py || (echo "auth fixture no longer uses the demo seed"; exit 1)
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pip-audit

      - run: pip-audit --strict -r requirements.txt
